ktor {

    deployment {
        host = 0.0.0.0
        port = 10000
        port = ${?PORT}
        environment = ${?ENV}
    }

    application {
        modules = [ homeaq.dothattask.ApplicationKt.module ]
    }

    postgres {
        url = ${DB_URL}
        user = ${DB_USER}
        password = ${DB_PASSWORD}
    }

    database {
            embedded = ${DB_EMB}
        }

    jwt {
        secret = ${JWT_SECRET}
        issuer = ${JWT_ISSUER}
        audience = ${JWT_AUDIENCE}
        realm = ${JWT_REALM}
        accessTtlMinutes = 15
        accessTtlMinutes = ${?JWT_ACCESS_TTL_MIN}
        refreshTtlDays = 30
        refreshTtlDays = ${?JWT_REFRESH_TTL_DAYS}
    }

    fcm {
            notificationTime = ${?NOTIFICATION_TIME}
        }


    # Firebase Admin SDK. Optional — if neither this property nor the
    # GOOGLE_APPLICATION_CREDENTIALS env var is set, push notifications
    # become a no-op and the rest of the app boots normally.
    firebase {
        credentialsPath = ${?FIREBASE_CREDENTIALS_PATH}
    }

    # Outbound transactional email via Resend. The API key and sender
    # address are read exclusively from environment variables so no
    # credential is ever committed. If `EMAIL_ENABLED` is false (or the
    # key is missing) the service degrades gracefully — registration and
    # invites still succeed but no email is delivered (logged as a warning).
    email {
        enabled = false
        enabled = ${?EMAIL_ENABLED}
        resendApiKey = ${?RESEND_API_KEY}
        fromEmail = ${?RESEND_FROM_EMAIL}
        fromName = ${?RESEND_FROM_NAME}
        appBaseUrl = ${?APP_BASE_URL}
        verificationTtlHours = 24
        verificationTtlHours = ${?EMAIL_VERIFICATION_TTL_HOURS}
    }
}
